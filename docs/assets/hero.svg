<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">interccom</title>
  <desc id="desc">Talk to your coding agents. Let them talk back. One hub on your machine gives Claude Code, Codex, Copilot CLI and OpenCode sessions a shared voice channel.</desc>
  <defs>
    <radialGradient id="glow" cx="76%" cy="50%" r="45%">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hubfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C232D"/>
      <stop offset="1" stop-color="#131921"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .bar { transform-box: fill-box; transform-origin: center; animation: talk 1.1s ease-in-out infinite; }
      .b2 { animation-delay: -0.15s; } .b3 { animation-delay: -0.45s; } .b4 { animation-delay: -0.3s; }
      .b5 { animation-delay: -0.6s; } .b6 { animation-delay: -0.75s; } .b7 { animation-delay: -0.9s; }
      @keyframes talk { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ripple 3.2s ease-out infinite; }
      .r2 { animation-delay: -1.6s; }
      @keyframes ripple { 0% { transform: scale(0.75); opacity: 0.55; } 100% { transform: scale(1.35); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .bar, .ring { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="#0D1117"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" fill="none" stroke="#30363D"/>

  <!-- Left: wordmark -->
  <text x="72" y="104" class="mono" font-size="14" letter-spacing="2.5" fill="#7D8590">CLAUDE CODE · CODEX · COPILOT CLI · OPENCODE</text>
  <text x="68" y="200" class="sans" font-size="88" font-weight="700" letter-spacing="-2" fill="#F0F6FC">inter<tspan fill="#F5A524">cc</tspan>om</text>
  <text x="72" y="256" class="sans" font-size="28" fill="#C9D1D9">Talk to your coding agents.</text>
  <text x="72" y="294" class="sans" font-size="28" fill="#F5A524">Let them talk back.</text>
  <g class="sans" font-size="15" fill="#8B949E">
    <rect x="72" y="330" width="122" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="133" y="352" text-anchor="middle">one voice</text>
    <rect x="204" y="330" width="150" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="279" y="352" text-anchor="middle">many sessions</text>
    <rect x="364" y="330" width="170" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="449" y="352" text-anchor="middle">no push-to-talk</text>
  </g>

  <!-- Right: hub with sessions around it -->
  <g stroke="#30363D" stroke-width="1.5" stroke-dasharray="4 6" fill="none">
    <path d="M876 106 L920 158"/>
    <path d="M1066 106 L1022 158"/>
    <path d="M876 314 L920 262"/>
    <path d="M1066 314 L1022 262"/>
  </g>

  <circle class="ring" cx="971" cy="210" r="86" fill="none" stroke="#F5A524" stroke-width="1.5"/>
  <circle class="ring r2" cx="971" cy="210" r="86" fill="none" stroke="#F5A524" stroke-width="1.5"/>
  <circle cx="971" cy="210" r="72" fill="url(#hubfill)" stroke="#F5A524" stroke-width="2"/>
  <g fill="#F5A524">
    <rect class="bar"    x="935" y="190" width="6" height="40" rx="3"/>
    <rect class="bar b2" x="947" y="180" width="6" height="60" rx="3"/>
    <rect class="bar b3" x="959" y="172" width="6" height="76" rx="3"/>
    <rect class="bar b4" x="971" y="184" width="6" height="52" rx="3"/>
    <rect class="bar b5" x="983" y="176" width="6" height="68" rx="3"/>
    <rect class="bar b6" x="995" y="186" width="6" height="48" rx="3"/>
    <rect class="bar b7" x="1007" y="194" width="6" height="32" rx="3"/>
  </g>
  <text x="971" y="312" class="mono" font-size="13" letter-spacing="1.5" fill="#7D8590" text-anchor="middle">HUB</text>

  <g class="sans">
    <!-- top-left: speaking -->
    <rect x="712" y="66" width="178" height="52" rx="12" fill="#161B22" stroke="#F5A524" stroke-opacity="0.7"/>
    <circle cx="732" cy="92" r="5" fill="#F5A524"/>
    <text x="746" y="88" font-size="16" font-weight="600" fill="#F0F6FC">api</text>
    <text x="746" y="107" font-size="12.5" fill="#8B949E">Claude Code · speaking</text>
    <!-- top-right -->
    <rect x="1052" y="66" width="178" height="52" rx="12" fill="#161B22" stroke="#30363D"/>
    <circle cx="1072" cy="92" r="5" fill="#3FB950"/>
    <text x="1086" y="88" font-size="16" font-weight="600" fill="#F0F6FC">frontend</text>
    <text x="1086" y="107" font-size="12.5" fill="#8B949E">Codex · working</text>
    <!-- bottom-left -->
    <rect x="712" y="302" width="178" height="52" rx="12" fill="#161B22" stroke="#30363D"/>
    <circle cx="732" cy="328" r="5" fill="#58A6FF"/>
    <text x="746" y="324" font-size="16" font-weight="600" fill="#F0F6FC">docs</text>
    <text x="746" y="343" font-size="12.5" fill="#8B949E">Copilot CLI · waiting</text>
    <!-- bottom-right -->
    <rect x="1052" y="302" width="178" height="52" rx="12" fill="#161B22" stroke="#30363D"/>
    <circle cx="1072" cy="328" r="5" fill="#3FB950"/>
    <text x="1086" y="324" font-size="16" font-weight="600" fill="#F0F6FC">infra</text>
    <text x="1086" y="343" font-size="12.5" fill="#8B949E">OpenCode · working</text>
  </g>
</svg>
